<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aidea</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --line: #d8d8d2; --text: #1d1d1b; --muted: #6b6b66;
    --module: #dbe7ff; --class: #e4f3df; --function: #fdf0d2; --accent: #2f5fd0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1e; --line: #353532; --text: #ecece8; --muted: #9a9a94;
      --module: #27385f; --class: #2a4126; --function: #4a3d1c; --accent: #7aa2ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: 240px 1fr; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 15px; margin: 0; letter-spacing: .04em; }
  h2 { font-size: 12px; margin: 0; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  form { display: flex; flex-direction: column; gap: 6px; }
  input, button { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); }
  button { cursor: pointer; background: var(--accent); color: #fff; border: 0; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  li button { width: 100%; text-align: left; background: transparent; color: var(--text); border: 1px solid transparent; }
  li button[aria-current="true"] { border-color: var(--accent); }
  #error { color: #c0392b; min-height: 1.4em; }
  main { position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; cursor: grab; touch-action: none; }
  svg.dragging { cursor: grabbing; }
  rect { stroke: var(--line); }
  text { fill: var(--text); font-size: 13px; pointer-events: none; }
  .edge { stroke: var(--line); fill: none; }
  #hint { position: absolute; left: 16px; bottom: 12px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<aside>
  <h1>aidea</h1>
  <h2>Projects</h2>
  <ul id="projects"></ul>
  <form id="open">
    <input id="path" placeholder="Path to a Python project" aria-label="Path to a Python project" required>
    <button>Open project</button>
  </form>
  <div id="error" role="alert"></div>
</aside>
<main>
  <svg id="canvas" role="img" aria-label="Canvas"><g id="world"></g></svg>
  <div id="hint">Drag to pan, scroll to zoom</div>
</main>
<script>
const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const view = { x: 40, y: 40, k: 1 };
const apply = () => $("world").setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`);

// Pan and zoom
const svg = $("canvas");
svg.addEventListener("wheel", (e) => {
  e.preventDefault();
  const k = Math.min(4, Math.max(0.2, view.k * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
  const r = svg.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  view.x = px - ((px - view.x) / view.k) * k;
  view.y = py - ((py - view.y) / view.k) * k;
  view.k = k;
  apply();
}, { passive: false });
svg.addEventListener("pointerdown", (e) => { svg.setPointerCapture(e.pointerId); svg.classList.add("dragging"); });
svg.addEventListener("pointermove", (e) => {
  if (!svg.hasPointerCapture(e.pointerId)) return;
  view.x += e.movementX; view.y += e.movementY; apply();
});
svg.addEventListener("pointerup", (e) => { svg.releasePointerCapture(e.pointerId); svg.classList.remove("dragging"); });

// Drawing: one column per module, members stacked below, indented by depth
const el = (name, attrs, text) => {
  const n = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (text) n.textContent = text;
  return n;
};
function draw(nodes) {
  const world = $("world");
  world.replaceChildren();
  const kids = (id) => nodes.filter((n) => n.parent === id);
  nodes.filter((n) => n.kind === "module").forEach((mod, col) => {
    let row = 0;
    const place = (n, depth, parentPos) => {
      const pos = { x: col * 280 + depth * 18, y: row++ * 36, w: 240 - depth * 18, h: 28 };
      if (parentPos) {
        const mx = parentPos.x + 9;
        world.append(el("path", { class: "edge", d: `M${mx} ${parentPos.y + parentPos.h} V${pos.y + 14} H${pos.x}` }));
      }
      world.append(el("rect", { x: pos.x, y: pos.y, width: pos.w, height: pos.h, rx: 6, fill: `var(--${n.kind})` }));
      world.append(el("text", { x: pos.x + 10, y: pos.y + 19 }, `${n.kind === "function" ? "ƒ " : ""}${n.name.split(".").pop()}`));
      kids(n.id).forEach((c) => place(c, depth + 1, pos));
    };
    place(mod, 0, null);
  });
}

// Projects
let current = null;
async function refreshList() {
  const list = await (await fetch("/projects")).json();
  $("projects").replaceChildren(...list.map((p) => {
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.textContent = p.name;
    b.title = p.path;
    if (p.id === current) b.setAttribute("aria-current", "true");
    b.onclick = () => open(p.path);
    li.append(b);
    return li;
  }));
}
async function open(path) {
  $("error").textContent = "";
  const res = await fetch("/projects", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ path }) });
  const body = await res.json();
  if (!res.ok) { $("error").textContent = body.error; return; }
  current = body.id;
  draw(body.nodes);
  refreshList();
}
$("open").onsubmit = (e) => { e.preventDefault(); open($("path").value.trim()); };
apply();
refreshList();
</script>
</body>
</html>
